<!DOCTYPE html>
<!--
  月間勤務表サイト（全社員対応版）
  【できること】
  ・社員ごとにメールアドレスとパスワードでログインし、自分の勤務表だけを作成・修正
  ・対象年月・基本の勤務時間を設定し、1ヶ月分の勤務表を自動で作成（土日祝日は休日）
  ・日ごとの勤務区分（出勤・午前休・午後休・休日・有給休暇・欠勤）、時刻、備考を修正
  ・実働時間と集計（実働時間の合計・月間勤務日数・有給休暇取得日数・欠勤日数）を自動計算
  ・途中保存：入力が止まって3秒たつと自動で保存。「途中保存」ボタンでもすぐに保存できます
  ・提出：提出すると編集できなくなります（管理者が差し戻すと、また編集できます）
  ・管理者は、全社員の勤務表の一覧・閲覧・Excel出力・差し戻しができます
  ・管理者画面の一覧は、状態（未提出・提出済など）で絞り込み・並べ替えができます
  ・表示中の勤務表をExcelファイル（.xlsx）に出力
  ・表示中の勤務表をPDFファイル（A4縦）に出力

  保存先はインターネット上のデータベース「Supabase」です。
  接続先の設定は config.js に書きます（README.md の手順を参照）。

  このファイルは「HTML」「CSS」「JavaScript」の3つを1つにまとめています。
  ・<style> ～ </style> の中 … CSS（見た目）
  ・<body> ～ </body> の中  … HTML（画面に置く部品）
  ・<script> ～ </script> の中 … JavaScript（動き）
  この部分のように、記号で囲んだメモ書きを「コメント」といいます。画面には表示されません。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>月間勤務表</title>

  <!-- 接続先の設定（Supabase の URL と公開用のキー） -->
  <script src="config.js"></script>
  <!-- Supabase（ログインとデータ保存）を使うためのライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <!--
    Excel出力用の無料ライブラリ「ExcelJS 4.4.0」（MITライセンス）は vendor/exceljs.min.js に入れてあります。
    ページのいちばん最後で読み込みます。
  -->

  <style>
    /* ===== CSS：見た目の設定 ===== */

    /* ページ全体：文字の種類、背景色、余白 */
    body {
      font-family: "Yu Gothic UI", "Meiryo", sans-serif;
      background: #f4f6f8;
      color: #222;
      margin: 0;
      padding: 24px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 16px;
    }

    /* 隠しておく部品 */
    .hidden {
      display: none !important;
    }

    /* 白い四角の枠（カード） */
    .card {
      background: #fff;
      border: 1px solid #dde2e7;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 16px;
      max-width: 960px;
    }

    /* ログイン画面などの細いカード */
    .card.narrow {
      max-width: 400px;
    }

    .card h2 {
      font-size: 16px;
      margin: 0 0 12px;
      color: #2f5d8a;
    }

    .note {
      font-size: 14px;
      color: #555;
      margin: 0 0 12px;
    }

    /* 入力欄を横に並べる */
    .settings {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: flex-end;
    }

    .settings label,
    .stack label {
      display: flex;
      flex-direction: column;
      font-size: 14px;
      gap: 4px;
    }

    /* 入力欄を縦に並べる（ログイン画面） */
    .stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      font-size: 16px;
      padding: 6px 8px;
      border: 1px solid #b8c1ca;
      border-radius: 4px;
    }

    /* 選択欄（管理者画面の絞り込み・並べ替え）。入力欄と同じ見た目にする */
    .settings select {
      font-size: 16px;
      padding: 6px 8px;
      border: 1px solid #b8c1ca;
      border-radius: 4px;
      background: #fff;
    }

    /* 基本設定の入力欄の幅（1段に収まるように調整） */
    #employeeName { width: 150px; }
    #breakMinutes { width: 80px; }

    /* ボタン */
    .buttons {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    button {
      font-size: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: #fff;
      background: #2f5d8a;
    }

    #saveButton   { background: #5b7fa6; }
    #submitButton { background: #d68910; }
    button.excel  { background: #217346; }  /* Excelらしい緑色 */
    button.pdf    { background: #b03a2e; }  /* PDFらしい赤色 */
    button.gray   { background: #7f8c8d; }
    button:hover  { opacity: 0.85; }

    /* 押せない状態のボタン */
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* 文字だけのボタン（リンクのような見た目） */
    button.link-button {
      background: none;
      color: #2f5d8a;
      padding: 0;
      margin-top: 12px;
      font-size: 14px;
      text-decoration: underline;
    }

    /* 表の中の小さなボタン（管理者画面） */
    button.small {
      font-size: 13px;
      padding: 4px 10px;
      margin: 2px;
    }

    /* 画面上部の帯（タブとログアウト） */
    .topbar {
      max-width: 960px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .tabs {
      display: flex;
      gap: 8px;
    }

    .tabs button {
      background: #fff;
      color: #2f5d8a;
      border: 1px solid #2f5d8a;
    }

    .tabs button.active {
      background: #2f5d8a;
      color: #fff;
    }

    .user-box {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: #555;
    }

    /* 操作結果のメッセージ */
    .message {
      margin-top: 12px;
      font-size: 14px;
      color: #555;
      min-height: 1em;
    }

    .message.error {
      color: #c0392b;  /* エラーのときは赤字 */
    }

    /* 保存の状態（保存済み・未保存など） */
    #saveStatus {
      margin-top: 12px;
      font-size: 13px;
      color: #217346;
    }

    #saveStatus.pending { color: #d68910; }
    #saveStatus.error   { color: #c0392b; font-weight: bold; }

    /* 表が画面より広いときは、表だけ横にスクロールできるようにする（スマホ用） */
    .table-wrap {
      overflow-x: auto;
    }

    /* 勤務表の表 */
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px;
    }

    th, td {
      border: 1px solid #c9d1d9;
      padding: 6px 8px;
      text-align: center;
    }

    th {
      background: #2f5d8a;
      color: #fff;
      white-space: nowrap;
    }

    .empty {
      color: #888;
      padding: 24px;
    }

    /* 土曜日の行：うすい青 */
    tr.saturday td {
      background: #eaf2fb;
      color: #1f5fa8;
    }

    /* 日曜日・祝日の行：うすい赤 */
    tr.sunday td,
    tr.holiday td {
      background: #fdeeee;
      color: #c0392b;
    }

    /* 祝日名（小さめの文字） */
    .holiday-name {
      display: block;
      font-size: 11px;
    }

    /* 表の中の入力欄（少し小さめ） */
    td input,
    td select {
      font-size: 14px;
      padding: 3px 4px;
      border: 1px solid #b8c1ca;
      border-radius: 4px;
      background: #fff;
    }

    td input[type="number"] {
      width: 60px;
    }

    /* 入力できない状態の欄（休日の時刻など） */
    td input:disabled,
    td select:disabled {
      background: #f0f0f0;
      color: #aaa;
    }

    /* 実働時間がおかしいとき（退勤が出勤より前など） */
    td.error {
      color: #c0392b;
      font-weight: bold;
    }

    /* 備考の入力欄 */
    td input.remark {
      width: 140px;
    }

    /* 合計の行 */
    tfoot td {
      background: #e8eef5;
      font-weight: bold;
    }

    /* 集計欄の値は左寄せ */
    tfoot td.summary-value {
      text-align: left;
      padding-left: 16px;
    }

    /* 勤務表の状態のしるし（未作成・作成中・提出済） */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      white-space: nowrap;
    }
    .badge.none      { background: #eee;    color: #777; }
    .badge.draft     { background: #fdf2e0; color: #b9770e; }
    .badge.submitted { background: #e3f4ea; color: #217346; }

    /* 管理者画面：赤字の日（要確認）がある人の行は、うすい黄色にして目立たせる */
    tr.needs-check td {
      background: #fff8d6;
    }

    /* 「◯人を表示中」の欄 */
    #adminCount {
      margin: 8px 0 0;
    }

    /* PDF出力用の勤務表（画面の外に置いて、見えないようにしておく）
       幅 794px は、A4用紙の横幅とほぼ同じ比率です */
    #pdfArea {
      position: fixed;
      left: -10000px;
      top: 0;
      width: 794px;
      padding: 36px 40px;
      box-sizing: border-box;
      background: #fff;
      color: #222;
      font-family: "Yu Gothic UI", "Meiryo", sans-serif;
    }
    #pdfArea .pdf-title {
      font-size: 22px;
      font-weight: bold;
      margin: 0 0 10px;
    }
    #pdfArea .pdf-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 10px;
    }
    #pdfArea .pdf-name {
      font-size: 15px;
      font-weight: bold;
    }
    #pdfArea table {
      font-size: 12px;
    }
    #pdfArea th,
    #pdfArea td {
      padding: 3px 6px;
    }
    #pdfArea td.remark {
      text-align: left;
    }
    #pdfArea .pdf-summary {
      width: 60%;
      margin-top: 12px;
    }
    #pdfArea .pdf-summary th {
      background: #e8eef5;
      color: #222;
      text-align: left;
      width: 40%;
    }
    #pdfArea .pdf-summary td {
      text-align: left;
    }

    /* 狭い画面（スマホ）では余白を小さくする */
    @media (max-width: 600px) {
      body { padding: 12px; }
      .card { padding: 12px 14px; }
    }
  </style>
</head>

<body>
  <!-- ===== HTML：画面に置く部品 ===== -->

  <h1>勤務表作成ツール</h1>

  <!-- ===== ログイン画面 ===== -->
  <div id="loginView" class="card narrow hidden">
    <h2>ログイン</h2>
    <form id="loginForm" class="stack">
      <label>
        メールアドレス
        <input type="email" id="loginEmail" autocomplete="username" required>
      </label>
      <label>
        パスワード
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </label>
      <div class="buttons">
        <button type="submit" id="loginButton">ログイン</button>
      </div>
    </form>
    <button type="button" class="link-button" id="forgotButton">パスワードを忘れた場合</button>
    <div id="loginMessage" class="message"></div>
  </div>

  <!-- ===== パスワード設定画面（招待メール・再設定メールのリンクから開いたとき） ===== -->
  <div id="passwordView" class="card narrow hidden">
    <h2>パスワードの設定</h2>
    <p class="note">新しいパスワードを入力してください（8文字以上）。</p>
    <form id="passwordForm" class="stack">
      <label>
        新しいパスワード
        <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required>
      </label>
      <label>
        確認のため、もう一度
        <input type="password" id="newPassword2" autocomplete="new-password" minlength="8" required>
      </label>
      <div class="buttons">
        <button type="submit" id="passwordButton">設定する</button>
      </div>
    </form>
    <div id="passwordMessage" class="message"></div>
  </div>

  <!-- ===== ログイン後の画面 ===== -->
  <div id="appView" class="hidden">
    <div class="topbar">
      <div class="tabs">
        <button id="myTab" class="active">自分の勤務表</button>
        <!-- 管理者タブは、管理者のときだけ表示されます -->
        <button id="adminTab" class="hidden">管理者</button>
      </div>
      <div class="user-box">
        <span id="userEmail"></span>
        <button id="logoutButton" class="gray">ログアウト</button>
      </div>
    </div>

    <!-- ----- 自分の勤務表 ----- -->
    <div id="myView">
      <!-- 設定エリア -->
      <div class="card">
        <h2>基本設定</h2>
        <div class="settings">
          <label>
            氏名
            <input type="text" id="employeeName" placeholder="例：山田 太郎" maxlength="30">
          </label>
          <label>
            対象年月
            <input type="month" id="targetMonth">
          </label>
          <label>
            基本出勤時刻
            <input type="time" id="startTime" value="09:00">
          </label>
          <label>
            基本退勤時刻
            <input type="time" id="endTime" value="18:00">
          </label>
          <label>
            休憩時間（分）
            <input type="number" id="breakMinutes" value="60" min="0" step="5">
          </label>
        </div>

        <div class="buttons">
          <button id="createButton">勤務表を作成する</button>
          <button id="saveButton">途中保存</button>
          <button id="submitButton">提出する</button>
          <button id="excelButton" class="excel">Excel出力</button>
          <button id="pdfButton" class="pdf">PDF出力</button>
        </div>

        <div id="saveStatus"></div>
        <div id="message" class="message"></div>
      </div>

      <!-- 勤務表エリア -->
      <div class="card">
        <h2>勤務表</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>日付</th>
                <th>曜日</th>
                <th>勤務区分</th>
                <th>出勤時刻</th>
                <th>退勤時刻</th>
                <th>休憩時間</th>
                <th>実働時間</th>
                <th>備考</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
            <!-- 合計の行（勤務表を作ると表示されます） -->
            <tfoot id="tableFoot"></tfoot>
          </table>
        </div>
      </div>
    </div>

    <!-- ----- 管理者画面 ----- -->
    <div id="adminView" class="hidden">
      <div class="card">
        <h2>全社員の勤務表</h2>
        <div class="settings">
          <label>
            対象年月
            <input type="month" id="adminMonth">
          </label>
          <!-- 絞り込みと並べ替え（読み込み済みの一覧を表示し直すだけで、データベースは読み直しません） -->
          <label>
            絞り込み
            <select id="adminFilter">
              <option value="all">すべて</option>
              <option value="unsubmitted">未提出のみ</option>
              <option value="none">未作成のみ</option>
              <option value="draft">作成中のみ</option>
              <option value="submitted">提出済のみ</option>
            </select>
          </label>
          <label>
            並べ替え
            <select id="adminSort">
              <option value="name">氏名順</option>
              <option value="status">状態順</option>
              <option value="updated">最終更新が古い順</option>
            </select>
          </label>
          <button id="adminReloadButton">表示を更新</button>
          <button id="adminExportAllButton" class="excel">全員分をExcel出力</button>
        </div>
        <div id="adminMessage" class="message"></div>
        <!-- 絞り込み中に「◯人を表示中」と出す欄 -->
        <div id="adminCount" class="note"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>氏名</th>
                <th>メールアドレス</th>
                <th>状態</th>
                <th>実働時間の合計</th>
                <th>勤務日数</th>
                <th>有給休暇</th>
                <th>欠勤</th>
                <th>最終更新</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="adminBody"></tbody>
          </table>
        </div>
      </div>

      <!-- 「表示」を押した社員の勤務表（読み取り専用） -->
      <div id="adminDetail" class="card hidden">
        <h2 id="adminDetailTitle"></h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>日付</th>
                <th>曜日</th>
                <th>勤務区分</th>
                <th>出勤時刻</th>
                <th>退勤時刻</th>
                <th>休憩時間</th>
                <th>実働時間</th>
                <th>備考</th>
              </tr>
            </thead>
            <tbody id="adminDetailBody"></tbody>
            <tfoot id="adminDetailFoot"></tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 備考欄の候補の一覧。候補を増やしたいときは <option> の行を書き足します -->
  <datalist id="remarkOptions">
    <option value="在宅勤務">
    <option value="出張">
    <option value="休日出勤">
  </datalist>

  <!-- PDF出力のときだけ、ここに印刷用の勤務表を組み立てます（画面には表示されません） -->
  <div id="pdfArea" aria-hidden="true"></div>

  <script>
    // ===== JavaScript：動きの設定 =====
    // 「//」から行の終わりまではコメント（メモ）です。

    // 曜日の名前（JavaScriptでは日曜日が0番、土曜日が6番）
    const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

    // 勤務表の中身をしまっておく入れ物（配列）。1日分が1つの要素になります。
    let rows = [];

    // 表示中の勤務表の年月と基本設定（勤務表を作るまでは null ＝ 空っぽ）
    // 例：{ year: 2026, month: 11, startTime: "09:00", endTime: "18:00", breakMinutes: 60 }
    let shown = null;

    // 表示中の勤務表の状態（null ＝ まだ保存していない、"draft" ＝ 作成中、"submitted" ＝ 提出済）
    let sheetStatus = null;

    // ログイン中の人の情報
    let currentUser = null;  // ログインの情報（メールアドレスなど）
    let profile = null;      // 氏名・管理者かどうか・基本時刻

    // よく使う部品
    const $ = (id) => document.getElementById(id);
    const myBody = $("tableBody");
    const myFoot = $("tableFoot");

    // 対象年月の初期値を「今月」にする
    const today = new Date();
    const thisMonth = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0"); // 例："2026-10"
    $("targetMonth").value = thisMonth;
    $("adminMonth").value = thisMonth;

    // メッセージを表示するための小さな道具（関数）
    // isError が true のときは赤字で表示します。boxId を省くと「自分の勤務表」のメッセージ欄に出します
    function showMessage(text, isError, boxId) {
      const box = $(boxId || "message");
      box.textContent = text;
      box.className = "message" + (isError ? " error" : "");
    }

    // 文字の中の「<」や「&」などを、画面に表示しても崩れない形に変える道具
    // （氏名などを表に書き出すときに使います）
    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // 日時を "11/3 14:32" のような文字にする道具
    function formatDateTime(value) {
      const d = new Date(value);
      return (d.getMonth() + 1) + "/" + d.getDate() + " " +
        String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    }

    // ------------------------------------------------------------
    // 祝日の判定
    // 外部サービスは使わず、祝日法のルールを計算で再現します。
    // （2022年以降の祝日ルールに対応しています）
    // ------------------------------------------------------------

    // 「○月の第△月曜日」が何日かを求める（成人の日・海の日など）
    function nthMonday(year, month, n) {
      const firstDay = new Date(year, month - 1, 1).getDay();  // 1日の曜日
      const firstMonday = 1 + ((8 - firstDay) % 7);             // 最初の月曜日の日付
      return firstMonday + (n - 1) * 7;
    }

    // 春分の日・秋分の日（天文学の計算にもとづく、よく使われる計算式）
    function vernalEquinoxDay(year) {
      return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
    }
    function autumnalEquinoxDay(year) {
      return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
    }

    // その年の祝日一覧を作る。結果は { "2026-11-03": "文化の日", ... } という形。
    function getHolidays(year) {
      const list = {};
      function add(month, day, name) {
        list[toKey(year, month, day)] = name;
      }

      add(1, 1, "元日");
      add(1, nthMonday(year, 1, 2), "成人の日");
      add(2, 11, "建国記念の日");
      add(2, 23, "天皇誕生日");
      add(3, vernalEquinoxDay(year), "春分の日");
      add(4, 29, "昭和の日");
      add(5, 3, "憲法記念日");
      add(5, 4, "みどりの日");
      add(5, 5, "こどもの日");
      add(7, nthMonday(year, 7, 3), "海の日");
      add(8, 11, "山の日");
      add(9, nthMonday(year, 9, 3), "敬老の日");
      add(9, autumnalEquinoxDay(year), "秋分の日");
      add(10, nthMonday(year, 10, 2), "スポーツの日");
      add(11, 3, "文化の日");
      add(11, 23, "勤労感謝の日");

      // 振替休日：祝日が日曜日なら、その後の最初の「祝日でない日」が休みになる
      for (const key of Object.keys(list)) {
        const d = fromKey(key);
        if (d.getDay() === 0) {
          const next = new Date(d);
          do {
            next.setDate(next.getDate() + 1);
          } while (list[dateToKey(next)]);
          list[dateToKey(next)] = "振替休日";
        }
      }

      // 国民の休日：祝日と祝日にはさまれた平日は休みになる（9月に起こることがある）
      for (const key of Object.keys(list)) {
        const d = fromKey(key);
        const middle = new Date(d); middle.setDate(d.getDate() + 1);
        const after  = new Date(d); after.setDate(d.getDate() + 2);
        if (!list[dateToKey(middle)] && list[dateToKey(after)] && middle.getDay() !== 0) {
          list[dateToKey(middle)] = "国民の休日";
        }
      }

      return list;
    }

    // 日付を "2026-11-03" のような文字（キー）にする道具
    function toKey(year, month, day) {
      return year + "-" + String(month).padStart(2, "0") + "-" + String(day).padStart(2, "0");
    }
    function dateToKey(d) {
      return toKey(d.getFullYear(), d.getMonth() + 1, d.getDate());
    }
    function fromKey(key) {
      const [y, m, d] = key.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    // ------------------------------------------------------------
    // 勤務表を作る
    // ------------------------------------------------------------
    function createSchedule() {
      // 入力欄の値を読み取る
      const target = $("targetMonth").value;      // 例："2026-11"
      const startTime = $("startTime").value;     // 例："09:00"
      const endTime = $("endTime").value;         // 例："18:00"
      const breakMinutes = Number($("breakMinutes").value);

      // 入力のチェック（おかしな値なら、ここで止めてお知らせする）
      if (!target) {
        showMessage("対象年月を選んでください。", true);
        return;
      }
      if (!startTime || !endTime) {
        showMessage("基本出勤時刻と基本退勤時刻を入力してください。", true);
        return;
      }
      if (startTime >= endTime) {
        showMessage("基本退勤時刻は、基本出勤時刻より後の時刻にしてください。", true);
        return;
      }
      if (isNaN(breakMinutes) || breakMinutes < 0) {
        showMessage("休憩時間は0以上の数字（分）で入力してください。", true);
        return;
      }
      // すでに保存してある勤務表を作り直すときは、念のため確認する
      if (rows.length > 0 && !confirm("この月の勤務表は作成済みです。いま入力している内容を消して、作り直しますか？")) {
        return;
      }

      const [year, month] = target.split("-").map(Number);
      const holidays = getHolidays(year);
      const lastDay = new Date(year, month, 0).getDate();  // その月の最終日（28〜31）

      // 1日から月末まで、1日ずつ行を作る
      rows = [];
      for (let day = 1; day <= lastDay; day++) {
        const date = new Date(year, month - 1, day);
        const weekday = date.getDay();
        const holidayName = holidays[toKey(year, month, day)] || "";
        const isOff = weekday === 0 || weekday === 6 || holidayName !== "";

        rows.push({
          month: month,
          day: day,
          weekday: weekday,
          holidayName: holidayName,
          remark: "",  // 備考（最初は空）
          type: isOff ? "休日" : "出勤",
          start: isOff ? "" : startTime,
          end: isOff ? "" : endTime,
          breakMinutes: isOff ? 0 : breakMinutes
        });
      }

      // 表示中の年月と基本設定を覚えておく（勤務区分の変更・保存・Excel出力で使います）
      shown = { year: year, month: month, startTime: startTime, endTime: endTime, breakMinutes: breakMinutes };

      renderMine();
      markDirty();  // 作った勤務表を保存する

      // 基本の勤務時間を、次の月から最初に入る値として覚えておく
      sb.from("profiles")
        .update({ default_start: startTime, default_end: endTime, default_break: breakMinutes })
        .eq("id", currentUser.id)
        .then(function (res) { if (res.error) console.error(res.error); });

      const workDays = rows.filter(r => r.type === "出勤").length;
      showMessage(year + "年" + month + "月の勤務表を作成しました（出勤日 " + workDays + "日）。入力した内容は自動で保存されます。");
    }

    // ------------------------------------------------------------
    // 時間の計算
    // ------------------------------------------------------------

    // 勤務区分の選択肢
    const WORK_TYPES = ["出勤", "午前休", "午後休", "休日", "有給休暇", "欠勤"];

    // 時刻を入力して働く区分（勤務日数に数え、実働時間を計算する）
    const WORKING_TYPES = ["出勤", "午前休", "午後休"];
    function isWorking(type) {
      return WORKING_TYPES.includes(type);
    }

    // 780（分） → "13:00" のように時刻の形にする道具（入力欄に入れる用）
    function minutesToClock(total) {
      const h = Math.floor(total / 60);
      const m = total % 60;
      return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
    }

    // "09:30" → 570（0時からの分数）に変える道具
    function timeToMinutes(text) {
      const [h, m] = text.split(":").map(Number);
      return h * 60 + m;
    }

    // 510（分） → "8:30" のように「時間:分」の文字に変える道具
    function minutesToText(total) {
      const h = Math.floor(total / 60);
      const m = total % 60;
      return h + ":" + String(m).padStart(2, "0");
    }

    // 1日分の実働時間（分）を計算する
    // 実働時間 ＝ 退勤時刻 − 出勤時刻 − 休憩時間
    // 計算できないときは、理由を文字で返します
    function calcWorkMinutes(r) {
      if (!isWorking(r.type)) return 0;
      if (!r.start || !r.end) return "時刻を入力";
      const minutes = timeToMinutes(r.end) - timeToMinutes(r.start) - r.breakMinutes;
      if (timeToMinutes(r.end) <= timeToMinutes(r.start)) return "退勤が出勤より前";
      if (minutes < 0) return "休憩が長すぎます";
      return minutes;
    }

    // 計算できない日（赤字の日）だけを取り出す
    function findErrorDays(list) {
      return list.filter(r => typeof calcWorkMinutes(r) === "string");
    }

    // 実働時間の合計（分）。計算できない日は含めません
    function totalWorkMinutes(list) {
      return list.reduce(function (sum, r) {
        const m = calcWorkMinutes(r);
        return sum + (typeof m === "number" ? m : 0);
      }, 0);
    }

    // ------------------------------------------------------------
    // 勤務表（list）の中身を、画面の表（body と foot）に書き出す
    // editable が true なら、出勤・退勤・休憩などを入力欄にして、その場で修正できるようにします
    // false なら読み取り専用です（提出済みの勤務表や、管理者画面）
    // ------------------------------------------------------------
    function renderTable(body, foot, list, editable) {
      body.innerHTML = "";  // いったん表の中身を空にする

      if (list.length === 0) {
        body.innerHTML = '<tr><td colspan="8" class="empty">「勤務表を作成する」ボタンを押すと、ここに1ヶ月分の勤務表が表示されます。</td></tr>';
        foot.innerHTML = "";
        return 0;
      }

      list.forEach(function (r, index) {
        const tr = document.createElement("tr");

        // 行の色分け用のしるし（CSSの tr.saturday などと対応）
        if (r.holidayName) tr.className = "holiday";
        else if (r.weekday === 0) tr.className = "sunday";
        else if (r.weekday === 6) tr.className = "saturday";

        // 勤務区分の選択欄（プルダウン）を作る
        let options = "";
        for (const t of WORK_TYPES) {
          options += "<option" + (t === r.type ? " selected" : "") + ">" + t + "</option>";
        }
        const holidayText = r.holidayName ? '<span class="holiday-name">' + r.holidayName + "</span>" : "";

        // 読み取り専用のときは、すべての欄を入力できない状態（disabled）にする
        const locked = editable ? "" : " disabled";
        // 働かない日（休日・有給休暇・欠勤）は、時刻の欄を入力できない状態にする
        const off = (!editable || !isWorking(r.type)) ? " disabled" : "";

        tr.innerHTML =
          "<td>" + r.month + "/" + r.day + "</td>" +
          "<td>" + WEEKDAYS[r.weekday] + "</td>" +
          '<td><select data-field="type"' + locked + ">" + options + "</select>" + holidayText + "</td>" +
          '<td><input type="time" data-field="start" value="' + r.start + '"' + off + "></td>" +
          '<td><input type="time" data-field="end" value="' + r.end + '"' + off + "></td>" +
          '<td><input type="number" data-field="breakMinutes" min="0" step="5" value="' + r.breakMinutes + '"' + off + "> 分</td>" +
          '<td class="work-time"></td>' +
          // 備考：候補（remarkOptions）から選ぶことも、自由に入力することもできる欄
          '<td><input type="text" class="remark" data-field="remark" list="remarkOptions" placeholder="選択または入力"' + locked + "></td>";

        // 備考の文字は、あとから入れる（「"」や「<」などの記号が入っても表示が崩れないように）
        tr.querySelector('[data-field="remark"]').value = r.remark;

        // この行の入力欄が変更されたら、rows の中身を書き換える
        if (editable) {
          tr.querySelectorAll("select, input").forEach(function (el) {
            el.addEventListener("input", function () {
              updateRow(index, el.dataset.field, el.value);
            });
          });
        }

        body.appendChild(tr);
      });

      return updateWorkTimes(body, foot, list);
    }

    // 「自分の勤務表」を書き出す（提出済みなら読み取り専用）
    function renderMine() {
      reportRowErrors(renderTable(myBody, myFoot, rows, sheetStatus !== "submitted"));
      updateButtons();
    }

    // 1つの欄が修正されたときの処理
    function updateRow(index, field, value) {
      const r = rows[index];

      if (field === "type") {
        r.type = value;

        // 勤務表を作ったときの基本設定の時刻を使う
        const baseStart = shown.startTime;
        const baseEnd = shown.endTime;
        const baseBreak = shown.breakMinutes;
        // 半日分の勤務時間（分）＝ 1日の実働時間の半分。9:00〜18:00・休憩60分なら240分（4時間）
        const half = Math.round((timeToMinutes(baseEnd) - timeToMinutes(baseStart) - baseBreak) / 2);

        if (value === "出勤") {
          // 出勤に変えたら、基本の時刻を入れる
          r.start = baseStart;
          r.end = baseEnd;
          r.breakMinutes = baseBreak;
        } else if (value === "午後休") {
          // 午後休：午前だけ働く（出勤時刻から半日分）。例 9:00〜13:00
          r.start = baseStart;
          r.end = minutesToClock(timeToMinutes(baseStart) + half);
          r.breakMinutes = 0;
        } else if (value === "午前休") {
          // 午前休：午後だけ働く（退勤時刻までの半日分）。例 14:00〜18:00
          r.start = minutesToClock(timeToMinutes(baseEnd) - half);
          r.end = baseEnd;
          r.breakMinutes = 0;
        } else {
          // 働かない区分に変えたら、時刻を空にする
          r.start = "";
          r.end = "";
          r.breakMinutes = 0;
        }
        renderMine();  // 入力できる欄が変わるので、表を書き直す
        markDirty();
        return;
      }

      if (field === "breakMinutes") {
        r.breakMinutes = Number(value) || 0;
      } else {
        r[field] = value;  // start・end・remark のどれか
      }
      reportRowErrors(updateWorkTimes(myBody, myFoot, rows));  // 実働時間と合計だけを計算し直す
      markDirty();
    }

    // 勤務区分ごとの日数を数える（画面の集計欄・管理者画面・Excel出力で使います）
    // 有給休暇は1日、午前休・午後休は半日（0.5日）として数えます
    function countSummary(list) {
      const count = (type) => list.filter(r => r.type === type).length;
      const paidFull = count("有給休暇");
      const halfDays = count("午前休") + count("午後休");
      return {
        workDays: list.filter(r => isWorking(r.type)).length,
        paidFull: paidFull,
        halfDays: halfDays,
        paidDays: paidFull + halfDays * 0.5,
        absentDays: count("欠勤")
      };
    }

    // 各行の実働時間と、月の合計を計算して表示する
    // 戻り値は、計算できなかった日（赤字の日）の数です
    function updateWorkTimes(body, foot, list) {
      const cells = body.querySelectorAll(".work-time");
      let errorCount = 0;

      list.forEach(function (r, index) {
        const result = calcWorkMinutes(r);
        const cell = cells[index];

        if (typeof result === "string") {
          // 計算できなかった（理由の文字が返ってきた）
          cell.textContent = result;
          cell.className = "work-time error";
          errorCount++;
        } else {
          cell.textContent = isWorking(r.type) ? minutesToText(result) : "－";
          cell.className = "work-time";
        }
      });

      // 集計欄（月間勤務日数・有給休暇・欠勤・実働時間の合計）を表の下に書き出す
      const s = countSummary(list);
      let footHtml = "";
      // 上から順に表示されます。順番を変えたいときは、この行の並びを入れ替えます
      for (const item of [
        ["実働時間の合計", minutesToText(totalWorkMinutes(list))],
        ["月間勤務日数", s.workDays + "日"],
        ["有給休暇取得日数", s.paidDays + "日（全日 " + s.paidFull + "日・半休 " + s.halfDays + "回）"],
        ["欠勤日数", s.absentDays + "日"]
      ]) {
        footHtml += '<tr><td colspan="3">' + item[0] + '</td><td colspan="5" class="summary-value">' + item[1] + "</td></tr>";
      }
      foot.innerHTML = footHtml;

      return errorCount;
    }

    // 赤字のお知らせを出しているかどうかのしるし
    let hasRowError = false;

    // 赤字の日があれば、メッセージ欄でお知らせする（自分の勤務表だけ）
    function reportRowErrors(errorCount) {
      if (errorCount > 0) {
        showMessage("赤字の日が " + errorCount + " 件あります。時刻を確認してください（合計には含めていません）。", true);
        hasRowError = true;
      } else if (hasRowError) {
        showMessage("修正を反映しました。");
        hasRowError = false;
      }
    }

    // 状態に合わせて、ボタンを押せる・押せないを切り替える
    function updateButtons() {
      const hasSheet = shown !== null && rows.length > 0;
      const submitted = sheetStatus === "submitted";
      $("createButton").disabled = submitted;
      $("saveButton").disabled = !hasSheet || submitted;
      $("submitButton").disabled = !hasSheet || submitted;
      $("excelButton").disabled = !hasSheet;
      $("pdfButton").disabled = !hasSheet;
      // 提出済みの月は、基本設定も変えられないようにする
      for (const id of ["startTime", "endTime", "breakMinutes"]) {
        $(id).disabled = submitted;
      }
    }

    // ------------------------------------------------------------
    // 途中保存
    // 入力が止まってから3秒たつと、自動でデータベースに保存します
    // ------------------------------------------------------------
    let dirty = false;      // 保存していない変更があるかどうか
    let editCount = 0;      // 変更した回数（保存中にさらに変更されたかを見分けるため）
    let saveTimer = null;   // 自動保存の待ち時間を数えるタイマー
    let saveQueue = Promise.resolve(true);  // 保存の順番待ち（2つの保存が同時に走らないように）

    // 保存の状態を表示する
    function setSaveStatus(text, kind) {
      const box = $("saveStatus");
      box.textContent = text;
      box.className = kind || "";
    }

    // 内容が変わったことを記録し、3秒後に自動保存する
    function markDirty() {
      dirty = true;
      editCount++;
      setSaveStatus("未保存の変更があります（自動で保存します）", "pending");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveNow, 3000);
    }

    // すぐに保存する。保存できたら（または保存するものがなければ）true を返します
    function saveNow() {
      clearTimeout(saveTimer);
      saveQueue = saveQueue.then(saveToDatabase, saveToDatabase);
      return saveQueue;
    }

    async function saveToDatabase() {
      if (!dirty || !shown || !currentUser) return true;
      const countAtStart = editCount;
      setSaveStatus("保存中…", "pending");

      // 同じ人・同じ年月の行があれば上書き、なければ新しく作る（upsert）
      const { error } = await sb.from("timesheets").upsert({
        user_id: currentUser.id,
        year: shown.year,
        month: shown.month,
        settings: shown,
        rows: rows,
        status: "draft"
      }, { onConflict: "user_id,year,month" });

      if (error) {
        console.error(error);
        setSaveStatus("保存できませんでした。インターネット接続を確認して「途中保存」を押してください。（" + error.message + "）", "error");
        return false;
      }
      // 保存している間にさらに変更されていたら、未保存のまま（もう一度自動保存されます）
      if (editCount === countAtStart) {
        dirty = false;
        setSaveStatus("保存済み " + formatDateTime(new Date()));
      }
      sheetStatus = "draft";
      return !dirty;
    }

    // 「途中保存」ボタン
    async function saveButtonClicked() {
      dirty = true;  // 変更がなくても保存し直す
      if (await saveNow()) showMessage("途中保存しました。続きは別のパソコンやスマホからでも入力できます。");
    }

    // 保存していない変更があるままページを閉じようとしたら、確認を出す
    window.addEventListener("beforeunload", function (e) {
      if (dirty) {
        e.preventDefault();
        e.returnValue = "";
      }
    });

    // 別のタブに切り替えたり、スマホでアプリを閉じたりしたときも保存しておく
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden" && dirty) saveNow();
    });

    // ------------------------------------------------------------
    // 保存してある勤務表を読み込む（対象年月を変えたとき・ログインしたとき）
    // ------------------------------------------------------------
    let loadCount = 0;  // 続けて年月を変えたとき、古い読み込み結果を使わないための番号

    async function loadMonth() {
      const target = $("targetMonth").value;
      if (!target) return;

      // 今の月に保存していない変更があれば、先に保存する
      if (!(await saveNow())) {
        if (shown) $("targetMonth").value = shown.year + "-" + String(shown.month).padStart(2, "0");
        showMessage("保存できていない変更があるため、月を切り替えられませんでした。", true);
        return;
      }

      const myLoad = ++loadCount;
      const [year, month] = target.split("-").map(Number);
      setSaveStatus("読み込み中…", "pending");

      const { data, error } = await sb.from("timesheets")
        .select("settings, rows, status, updated_at")
        .eq("user_id", currentUser.id)
        .eq("year", year)
        .eq("month", month)
        .maybeSingle();

      if (myLoad !== loadCount) return;  // もっと新しい読み込みが始まっていたら、この結果は使わない
      hasRowError = false;

      if (error) {
        console.error(error);
        setSaveStatus("");
        showMessage("勤務表を読み込めませんでした（" + error.message + "）。", true);
        rows = [];
        shown = null;
        sheetStatus = null;
        renderMine();
        return;
      }

      if (data) {
        // 保存してある勤務表を表示する
        rows = data.rows;
        shown = data.settings;
        sheetStatus = data.status;
        $("startTime").value = shown.startTime;
        $("endTime").value = shown.endTime;
        $("breakMinutes").value = shown.breakMinutes;
        setSaveStatus("保存済み（最終保存 " + formatDateTime(data.updated_at) + "）");
        if (sheetStatus === "submitted") {
          showMessage(year + "年" + month + "月の勤務表は提出済みです。修正が必要なときは、管理者に差し戻しを依頼してください。");
        } else {
          showMessage(year + "年" + month + "月の勤務表を読み込みました。続きから入力できます。");
        }
      } else {
        // まだ作っていない月
        rows = [];
        shown = null;
        sheetStatus = null;
        $("startTime").value = profile.default_start;
        $("endTime").value = profile.default_end;
        $("breakMinutes").value = profile.default_break;
        setSaveStatus("");
        showMessage(year + "年" + month + "月の勤務表はまだありません。「勤務表を作成する」を押してください。");
      }
      renderMine();
    }

    // ------------------------------------------------------------
    // 提出する
    // ------------------------------------------------------------
    async function submitSheet() {
      if (!shown || rows.length === 0) return;
      const errorDays = findErrorDays(rows);
      if (errorDays.length > 0) {
        showMessage("赤字の日（" + errorDays.map(r => r.month + "/" + r.day).join("、") + "）を直してから提出してください。", true);
        return;
      }
      if (!confirm(shown.year + "年" + shown.month + "月の勤務表を提出します。提出すると、自分では修正できなくなります。よろしいですか？")) {
        return;
      }
      // 最新の内容を保存してから、状態を「提出済」にする
      if (!(await saveNow())) return;
      const { data, error } = await sb.from("timesheets")
        .update({ status: "submitted" })
        .eq("user_id", currentUser.id)
        .eq("year", shown.year)
        .eq("month", shown.month)
        .select("updated_at");
      if (error || !data || data.length === 0) {
        showMessage("提出できませんでした" + (error ? "（" + error.message + "）" : "") + "。もう一度お試しください。", true);
        return;
      }
      sheetStatus = "submitted";
      renderMine();
      setSaveStatus("提出済み " + formatDateTime(data[0].updated_at));
      showMessage(shown.year + "年" + shown.month + "月の勤務表を提出しました。");
    }

    // ------------------------------------------------------------
    // 氏名の変更（データベースの profiles に保存します）
    // ------------------------------------------------------------
    async function saveName() {
      const name = $("employeeName").value.trim();
      if (name === "") {
        $("employeeName").value = profile.full_name;
        showMessage("氏名を空にすることはできません。", true);
        return;
      }
      if (name === profile.full_name) return;
      const { error } = await sb.from("profiles").update({ full_name: name }).eq("id", currentUser.id);
      if (error) {
        showMessage("氏名を保存できませんでした（" + error.message + "）。", true);
        return;
      }
      profile.full_name = name;
      showMessage("氏名を「" + name + "」に変更しました。");
    }

    // ------------------------------------------------------------
    // Excel出力
    // 無料のライブラリ「ExcelJS」を使って .xlsx ファイルを作ります
    // ------------------------------------------------------------

    // Excelで使う色（先頭の FF は「不透明」という意味。残り6桁は画面と同じ色番号）
    const COLOR = {
      header: "FF2F5D8A",      // 見出しの紺色
      saturdayBg: "FFEAF2FB",  // 土曜日の背景（うすい青）
      saturdayText: "FF1F5FA8",
      holidayBg: "FFFDEEEE",   // 日曜・祝日の背景（うすい赤）
      holidayText: "FFC0392B",
      total: "FFE8EEF5",       // 合計欄の背景
      line: "FFC9D1D9"         // 罫線の色
    };

    // ブック（workbook）に、1人分の勤務表のシートを1枚書き込む
    // list ＝ 1日ごとの勤務内容、settings ＝ 年月と基本設定、employeeName ＝ 氏名
    function fillSheet(workbook, sheetName, list, settings, employeeName) {
      const { year, month } = settings;
      const sheet = workbook.addWorksheet(sheetName, {
        // 4行目（見出し）までを固定して、下にスクロールしても見出しが見えるようにする
        views: [{ state: "frozen", ySplit: 4 }],
        // 印刷設定：A4縦、横幅を1ページに収める
        pageSetup: { paperSize: 9, orientation: "portrait", fitToPage: true, fitToWidth: 1, fitToHeight: 0 }
      });

      // 列の幅（A列〜H列）
      sheet.columns = [
        { width: 9 },   // A 日付
        { width: 6 },   // B 曜日
        { width: 11 },  // C 勤務区分
        { width: 10 },  // D 出勤時刻
        { width: 10 },  // E 退勤時刻
        { width: 10 },  // F 休憩時間
        { width: 10 },  // G 実働時間
        { width: 24 }   // H 備考
      ];

      // 1行目：タイトル（A1〜H1をくっつけて1つのマスにする）
      sheet.mergeCells("A1:H1");
      sheet.getCell("A1").value = year + "年" + month + "月 勤務表";
      sheet.getCell("A1").font = { size: 16, bold: true };
      sheet.getRow(1).height = 28;

      // 2行目：氏名
      sheet.mergeCells("A2:H2");
      sheet.getCell("A2").value = "氏名：" + employeeName;
      sheet.getCell("A2").font = { size: 12, bold: true };
      sheet.getRow(2).height = 20;

      // 3行目：基本設定のメモ
      sheet.mergeCells("A3:H3");
      sheet.getCell("A3").value = "基本勤務時間：" + settings.startTime + "〜" + settings.endTime + "（休憩" + settings.breakMinutes + "分）";
      sheet.getCell("A3").font = { size: 10, color: { argb: "FF555555" } };

      // 4行目：見出し
      const headerRow = sheet.getRow(4);
      headerRow.values = ["日付", "曜日", "勤務区分", "出勤時刻", "退勤時刻", "休憩時間", "実働時間", "備考"];
      headerRow.height = 22;
      headerRow.eachCell(function (cell) {
        cell.font = { bold: true, color: { argb: "FFFFFFFF" } };
        cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: COLOR.header } };
      });

      // 5行目から：1日ずつ書き込む
      const firstRow = 5;
      list.forEach(function (r, i) {
        const n = firstRow + i;  // Excelの行番号
        const row = sheet.getRow(n);
        const minutes = calcWorkMinutes(r);
        // 時刻が入っている日だけ、時刻を書き込む（管理者が作成中の勤務表を出力したときに、空欄の日があっても大丈夫なように）
        const working = isWorking(r.type) && r.start && r.end;

        // 日付は「本物の日付」として入れる（Excelで並べ替えや計算ができるように）
        row.getCell(1).value = new Date(Date.UTC(year, month - 1, r.day));
        row.getCell(1).numFmt = "m/d";
        row.getCell(2).value = WEEKDAYS[r.weekday];
        row.getCell(3).value = r.type;

        if (working) {
          // Excelでは時刻を「1日を1とした割合」で表す（12:00 → 0.5）
          row.getCell(4).value = timeToMinutes(r.start) / 1440;
          row.getCell(5).value = timeToMinutes(r.end) / 1440;
          row.getCell(6).value = r.breakMinutes;
        }
        row.getCell(4).numFmt = "h:mm";
        row.getCell(5).numFmt = "h:mm";
        row.getCell(6).numFmt = '0"分"';

        // 実働時間はExcelの計算式で入れる（Excel上で時刻を直しても自動で計算し直されます）
        row.getCell(7).value = {
          formula: 'IF(OR(D' + n + '="",E' + n + '=""),"",E' + n + "-D" + n + "-F" + n + "/1440)",
          result: (working && typeof minutes === "number") ? minutes / 1440 : ""
        };
        row.getCell(7).numFmt = "[h]:mm";

        // 備考：祝日名と、手で入力した備考を「／」でつなげて入れる（例：文化の日／在宅勤務）
        row.getCell(8).value = [r.holidayName, r.remark.trim()].filter(t => t !== "").join("／");
        // 備考の欄にも、Excel上で候補を選べるプルダウンをつける（候補にない文字も入力できます）
        row.getCell(8).dataValidation = {
          type: "list",
          allowBlank: true,
          showErrorMessage: false,
          formulae: ['"' + Array.from(document.querySelectorAll("#remarkOptions option")).map(o => o.value).join(",") + '"']
        };

        // 勤務区分の欄に、Excel上でも選べるプルダウンをつける
        row.getCell(3).dataValidation = {
          type: "list",
          allowBlank: true,
          formulae: ['"' + WORK_TYPES.join(",") + '"']
        };

        // 土曜日は青、日曜・祝日は赤で色分け
        let bg = null, text = null;
        if (r.holidayName || r.weekday === 0) { bg = COLOR.holidayBg; text = COLOR.holidayText; }
        else if (r.weekday === 6) { bg = COLOR.saturdayBg; text = COLOR.saturdayText; }
        if (bg) {
          for (let c = 1; c <= 8; c++) {
            row.getCell(c).fill = { type: "pattern", pattern: "solid", fgColor: { argb: bg } };
            row.getCell(c).font = { color: { argb: text } };
          }
        }
      });
      const lastRow = firstRow + list.length - 1;

      // 合計欄（表の2行下）
      const sumRow = lastRow + 2;
      const range = (col) => col + firstRow + ":" + col + lastRow;  // 例：C5:C34
      const countif = (type) => 'COUNTIF(' + range("C") + ',"' + type + '")';  // 例：COUNTIF(C5:C34,"欠勤")
      const s = countSummary(list);

      // 集計の項目：[見出し, Excelの計算式, 計算結果, 表示の形式]
      // 上から順に出力されます（画面の集計欄と同じ順番）
      const summaryItems = [
        ["実働時間の合計", "SUM(" + range("G") + ")", totalWorkMinutes(list) / 1440, "[h]:mm"],
        ["月間勤務日数", WORKING_TYPES.map(countif).join("+"), s.workDays, '0"日"'],
        ["有給休暇取得日数", countif("有給休暇") + "+(" + countif("午前休") + "+" + countif("午後休") + ")*0.5", s.paidDays, '0.0"日"'],
        ["欠勤日数", countif("欠勤"), s.absentDays, '0"日"']
      ];
      const summaryRowNumbers = [];
      summaryItems.forEach(function (item, i) {
        const n = sumRow + i;
        summaryRowNumbers.push(n);
        sheet.mergeCells("A" + n + ":C" + n);
        sheet.getCell("A" + n).value = item[0];
        sheet.getCell("D" + n).value = { formula: item[1], result: item[2] };
        sheet.getCell("D" + n).numFmt = item[3];
      });
      // 有給休暇の行に、半休の数え方のメモを添える（順番を入れ替えても正しい行に付くように、行を探して付けます）
      const paidRow = sumRow + summaryItems.findIndex(item => item[0] === "有給休暇取得日数");
      sheet.getCell("E" + paidRow).value = "※午前休・午後休は0.5日";
      sheet.getCell("E" + paidRow).font = { size: 9, color: { argb: "FF555555" } };

      for (const n of summaryRowNumbers) {
        for (const col of ["A", "B", "C", "D"]) {
          const cell = sheet.getCell(col + n);
          cell.font = { bold: true };
          cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: COLOR.total } };
        }
      }

      // 罫線と文字の配置（見出し・勤務表・合計欄のすべてのマス）
      const thin = { style: "thin", color: { argb: COLOR.line } };
      const allRows = [];
      for (let n = 4; n <= lastRow; n++) allRows.push([n, 8]);
      for (const n of summaryRowNumbers) allRows.push([n, 4]);
      for (const [n, lastCol] of allRows) {
        for (let c = 1; c <= lastCol; c++) {
          const cell = sheet.getRow(n).getCell(c);
          cell.border = { top: thin, left: thin, bottom: thin, right: thin };
          // 備考の列（H列）は左寄せ、それ以外は中央寄せ
          cell.alignment = { horizontal: (c === 8 && n > 4) ? "left" : "center", vertical: "middle" };
        }
      }
    }

    // ファイル名やシート名に使えない記号（\ / : * ? " < > | [ ]）と空白を取り除く
    function safeText(text) {
      return text.replace(/[\\/:*?"<>|\[\]\s]/g, "");
    }

    // ファイル名を作る（例：勤務表_2026年11月_山田太郎.xlsx）
    // extension を省くと「.xlsx」になります（PDFのときは ".pdf" を渡します）
    function makeFileName(settings, suffix, extension) {
      const s = safeText(suffix || "");
      return "勤務表_" + settings.year + "年" + settings.month + "月" + (s ? "_" + s : "") + (extension || ".xlsx");
    }

    // ブックをファイルにして、パソコンに保存（ダウンロード）する
    async function downloadWorkbook(workbook, fileName) {
      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      // 保存が始まったあとで、後片付けをする（すぐに片付けると保存に失敗することがあるため）
      setTimeout(function () {
        URL.revokeObjectURL(link.href);
        link.remove();
      }, 1000);
    }

    // ExcelJS が読み込めているかを調べる
    function excelReady(boxId) {
      if (typeof ExcelJS === "undefined") {
        showMessage("Excel出力用の部品（ExcelJS）を読み込めませんでした。ページを再読み込みしてください。", true, boxId);
        return false;
      }
      return true;
    }

    // 「Excel出力」ボタン（自分の勤務表）
    async function exportMine() {
      // 勤務表がまだ作られていなければ、お知らせして止める
      if (!shown || rows.length === 0) {
        showMessage("先に「勤務表を作成する」ボタンで勤務表を作ってください。", true);
        return;
      }
      // 赤字（計算できない日）が残っていれば、お知らせして止める
      const errorDays = findErrorDays(rows);
      if (errorDays.length > 0) {
        showMessage("赤字の日（" + errorDays.map(r => r.month + "/" + r.day).join("、") + "）を直してから出力してください。", true);
        return;
      }
      if (!excelReady()) return;

      const workbook = new ExcelJS.Workbook();  // Excelファイル（ブック）を新しく作る
      fillSheet(workbook, shown.month + "月", rows, shown, profile.full_name);
      const fileName = makeFileName(shown, profile.full_name);
      await downloadWorkbook(workbook, fileName);
      showMessage("「" + fileName + "」を出力しました。ブラウザの「ダウンロード」フォルダを確認してください。");
    }

    // ------------------------------------------------------------
    // PDF出力
    // 印刷用の勤務表を画面の外（#pdfArea）に組み立て、無料のライブラリ
    // 「html2canvas」で画像にしてから、「jsPDF」でA4縦のPDFに貼り付けます。
    // 画像にしてから貼るので、日本語の文字がPDFで文字化けしません。
    // ------------------------------------------------------------

    // 印刷用の勤務表（HTML）を作る
    function buildPdfHtml(list, settings, employeeName, status) {
      const s = countSummary(list);
      const statusText = status === "submitted" ? "提出済" : "作成中";

      let body = "";
      list.forEach(function (r) {
        let rowClass = "";
        if (r.holidayName) rowClass = "holiday";
        else if (r.weekday === 0) rowClass = "sunday";
        else if (r.weekday === 6) rowClass = "saturday";

        const minutes = calcWorkMinutes(r);
        const working = isWorking(r.type) && r.start && r.end;
        const remark = [r.holidayName, r.remark.trim()].filter(t => t !== "").join("／");

        body +=
          '<tr class="' + rowClass + '">' +
          "<td>" + r.month + "/" + r.day + "</td>" +
          "<td>" + WEEKDAYS[r.weekday] + "</td>" +
          "<td>" + escapeHtml(r.type) + "</td>" +
          "<td>" + (working ? r.start : "") + "</td>" +
          "<td>" + (working ? r.end : "") + "</td>" +
          "<td>" + (working ? r.breakMinutes + "分" : "") + "</td>" +
          "<td>" + (typeof minutes === "number" && isWorking(r.type) ? minutesToText(minutes) : "－") + "</td>" +
          '<td class="remark">' + escapeHtml(remark) + "</td>" +
          "</tr>";
      });

      // 集計欄（画面の集計欄と同じ順番）
      let summary = "";
      for (const item of [
        ["実働時間の合計", minutesToText(totalWorkMinutes(list))],
        ["月間勤務日数", s.workDays + "日"],
        ["有給休暇取得日数", s.paidDays + "日（全日 " + s.paidFull + "日・半休 " + s.halfDays + "回）"],
        ["欠勤日数", s.absentDays + "日"]
      ]) {
        summary += "<tr><th>" + item[0] + "</th><td>" + item[1] + "</td></tr>";
      }

      return (
        '<p class="pdf-title">' + settings.year + "年" + settings.month + "月 勤務表</p>" +
        '<div class="pdf-info">' +
          '<span class="pdf-name">氏名：' + escapeHtml(employeeName) + "</span>" +
          "<span>状態：" + statusText + "　出力日：" + dateToKey(new Date()).replace(/-/g, "/") + "</span>" +
        "</div>" +
        '<div class="pdf-info"><span>基本勤務時間：' + settings.startTime + "〜" + settings.endTime +
          "（休憩" + settings.breakMinutes + "分）</span></div>" +
        "<table><thead><tr>" +
          "<th>日付</th><th>曜日</th><th>勤務区分</th><th>出勤時刻</th><th>退勤時刻</th><th>休憩時間</th><th>実働時間</th><th>備考</th>" +
        "</tr></thead><tbody>" + body + "</tbody></table>" +
        '<table class="pdf-summary"><tbody>' + summary + "</tbody></table>" +
        '<p class="note" style="margin-top:6px;font-size:11px;">※午前休・午後休は有給休暇0.5日として数えています</p>'
      );
    }

    // html2canvas と jsPDF が読み込めているかを調べる
    function pdfReady(boxId) {
      if (typeof html2canvas === "undefined" || typeof jspdf === "undefined") {
        showMessage("PDF出力用の部品（html2canvas・jsPDF）を読み込めませんでした。ページを再読み込みしてください。", true, boxId);
        return false;
      }
      return true;
    }

    // 「PDF出力」ボタン（自分の勤務表）
    async function exportPdfMine() {
      if (!shown || rows.length === 0) {
        showMessage("先に「勤務表を作成する」ボタンで勤務表を作ってください。", true);
        return;
      }
      const errorDays = findErrorDays(rows);
      if (errorDays.length > 0) {
        showMessage("赤字の日（" + errorDays.map(r => r.month + "/" + r.day).join("、") + "）を直してから出力してください。", true);
        return;
      }
      if (!pdfReady()) return;

      const button = $("pdfButton");
      button.disabled = true;  // 作っている間に2回押されないようにする
      showMessage("PDFを作成しています…");
      const area = $("pdfArea");
      try {
        area.innerHTML = buildPdfHtml(rows, shown, profile.full_name, sheetStatus);
        // 2倍の細かさで画像にする（PDFで文字がぼやけないように）
        const canvas = await html2canvas(area, { scale: 2, backgroundColor: "#ffffff" });

        // A4縦（210mm × 297mm）、まわりに10mmの余白をとって、はみ出さない大きさで貼る
        const pdf = new jspdf.jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
        const margin = 10;
        const maxWidth = 210 - margin * 2;
        const maxHeight = 297 - margin * 2;
        let width = maxWidth;
        let height = canvas.height * width / canvas.width;
        if (height > maxHeight) {
          height = maxHeight;
          width = canvas.width * height / canvas.height;
        }
        // JPEG で貼る（PNG だとファイルが10MB以上になるため）
        pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", (210 - width) / 2, margin, width, height);

        const fileName = makeFileName(shown, profile.full_name, ".pdf");
        pdf.save(fileName);
        showMessage("「" + fileName + "」を出力しました。ブラウザの「ダウンロード」フォルダを確認してください。");
      } catch (err) {
        console.error(err);
        showMessage("PDFの作成に失敗しました。もう一度お試しください。", true);
      } finally {
        area.innerHTML = "";
        updateButtons();
      }
    }

    // ------------------------------------------------------------
    // 管理者画面
    // ------------------------------------------------------------

    // 表示中の一覧（[{ person: 社員の情報, sheet: 勤務表 または null }, ...]）
    let adminList = [];
    let adminMonthShown = null;  // 一覧の年月 { year, month }

    const STATUS_LABEL = { none: "未作成", draft: "作成中", submitted: "提出済" };

    async function loadAdmin() {
      const target = $("adminMonth").value;
      if (!target) {
        showMessage("対象年月を選んでください。", true, "adminMessage");
        return;
      }
      const [year, month] = target.split("-").map(Number);
      showMessage("読み込み中…", false, "adminMessage");
      $("adminDetail").classList.add("hidden");

      // 社員の一覧と、その月の勤務表を同時に読み込む
      const [people, sheets] = await Promise.all([
        sb.from("profiles").select("id, email, full_name").order("full_name"),
        sb.from("timesheets").select("user_id, settings, rows, status, updated_at").eq("year", year).eq("month", month)
      ]);
      if (people.error || sheets.error) {
        showMessage("読み込めませんでした（" + (people.error || sheets.error).message + "）。", true, "adminMessage");
        return;
      }

      adminMonthShown = { year: year, month: month };
      adminList = people.data.map(function (person) {
        return { person: person, sheet: sheets.data.find(s => s.user_id === person.id) || null };
      });
      renderAdmin();

      const submitted = adminList.filter(a => statusOf(a) === "submitted").length;
      showMessage(year + "年" + month + "月：社員 " + adminList.length + "人のうち、提出済 " + submitted + "人・未提出 " + (adminList.length - submitted) + "人", false, "adminMessage");
    }

    // 1人分の状態（"none" ＝ 未作成、"draft" ＝ 作成中、"submitted" ＝ 提出済）
    function statusOf(a) {
      return a.sheet ? a.sheet.status : "none";
    }

    // 「状態順」で並べるときの順番（数字が小さいほど上）
    const STATUS_ORDER = { none: 0, draft: 1, submitted: 2 };

    // 絞り込み・並べ替えをした「表示用の一覧」を作る
    // adminList そのものは並べ替えません（ボタンを押したときに、別の人を選んでしまわないように）
    function visibleAdminList() {
      const filter = $("adminFilter").value;
      const sort = $("adminSort").value;

      // 絞り込み
      const list = adminList.filter(function (a) {
        const status = statusOf(a);
        if (filter === "all") return true;
        if (filter === "unsubmitted") return status !== "submitted";
        return status === filter;  // "none"・"draft"・"submitted" のどれか
      });

      // 並べ替え（adminList は氏名順に読み込んであるので、同じ順位どうしは元の順番＝氏名順のまま残ります）
      const nameOrder = new Map(adminList.map((a, i) => [a, i]));
      list.sort(function (x, y) {
        if (sort === "status") {
          const diff = STATUS_ORDER[statusOf(x)] - STATUS_ORDER[statusOf(y)];
          if (diff !== 0) return diff;
        } else if (sort === "updated") {
          // 勤務表のない人を先頭に、そのあとは最終更新が古い順
          if (!x.sheet !== !y.sheet) return x.sheet ? 1 : -1;
          if (x.sheet && y.sheet) {
            const diff = new Date(x.sheet.updated_at) - new Date(y.sheet.updated_at);
            if (diff !== 0) return diff;
          }
        }
        return nameOrder.get(x) - nameOrder.get(y);
      });
      return list;
    }

    // 一覧の表を書き出す
    function renderAdmin() {
      const body = $("adminBody");
      const list = visibleAdminList();

      // 絞り込み中は「◯人を表示中」と出す
      $("adminCount").textContent = ($("adminFilter").value !== "all" && adminList.length > 0)
        ? adminList.length + "人中 " + list.length + "人を表示中"
        : "";

      if (adminList.length === 0) {
        body.innerHTML = '<tr><td colspan="9" class="empty">社員が登録されていません。</td></tr>';
        return;
      }
      if (list.length === 0) {
        body.innerHTML = '<tr><td colspan="9" class="empty">条件に合う社員はいません。</td></tr>';
        return;
      }
      body.innerHTML = list.map(function (a) {
        const sheet = a.sheet;
        const status = statusOf(a);
        // ボタンには「社員のid」を付けておき、押されたときに id で社員を探します（表示順が変わっても大丈夫なように）
        const id = escapeHtml(a.person.id);
        let cells = "<td>－</td><td>－</td><td>－</td><td>－</td><td>－</td>";
        let actions = "";
        let errors = 0;
        if (sheet) {
          const s = countSummary(sheet.rows);
          errors = findErrorDays(sheet.rows).length;
          cells =
            "<td>" + minutesToText(totalWorkMinutes(sheet.rows)) + (errors > 0 ? '<br><span class="badge draft">要確認 ' + errors + "件</span>" : "") + "</td>" +
            "<td>" + s.workDays + "日</td>" +
            "<td>" + s.paidDays + "日</td>" +
            "<td>" + s.absentDays + "日</td>" +
            "<td>" + formatDateTime(sheet.updated_at) + "</td>";
          actions =
            '<button class="small" data-action="view" data-id="' + id + '">表示</button>' +
            '<button class="small excel" data-action="excel" data-id="' + id + '">Excel</button>' +
            (status === "submitted" ? '<button class="small gray" data-action="reopen" data-id="' + id + '">差し戻し</button>' : "");
        }
        // 赤字の日（要確認）がある人の行は、うすい黄色にする
        return (errors > 0 ? '<tr class="needs-check">' : "<tr>") +
          "<td>" + escapeHtml(a.person.full_name) + "</td>" +
          "<td>" + escapeHtml(a.person.email || "") + "</td>" +
          '<td><span class="badge ' + status + '">' + STATUS_LABEL[status] + "</span></td>" +
          cells +
          "<td>" + actions + "</td>" +
          "</tr>";
      }).join("");
    }

    // 一覧の中のボタン（表示・Excel・差し戻し）が押されたとき
    $("adminBody").addEventListener("click", function (e) {
      const button = e.target.closest("button[data-action]");
      if (!button) return;
      // ボタンに付けた社員の id で、どの人かを探す
      const a = adminList.find(item => item.person.id === button.dataset.id);
      if (!a) return;
      if (button.dataset.action === "view") showAdminDetail(a);
      if (button.dataset.action === "excel") exportOne(a);
      if (button.dataset.action === "reopen") reopenSheet(a);
    });

    // 社員の勤務表を読み取り専用で表示する
    function showAdminDetail(a) {
      const { year, month } = adminMonthShown;
      $("adminDetailTitle").textContent = a.person.full_name + " さん　" + year + "年" + month + "月（" + STATUS_LABEL[a.sheet.status] + "）";
      renderTable($("adminDetailBody"), $("adminDetailFoot"), a.sheet.rows, false);
      $("adminDetail").classList.remove("hidden");
      $("adminDetail").scrollIntoView({ behavior: "smooth" });
    }

    // 1人分をExcel出力する
    async function exportOne(a) {
      if (!excelReady("adminMessage")) return;
      const workbook = new ExcelJS.Workbook();
      fillSheet(workbook, a.sheet.settings.month + "月", a.sheet.rows, a.sheet.settings, a.person.full_name);
      const fileName = makeFileName(a.sheet.settings, a.person.full_name);
      await downloadWorkbook(workbook, fileName);
      showMessage("「" + fileName + "」を出力しました。", false, "adminMessage");
    }

    // 全員分を1つのExcelファイルにまとめて出力する（1人1シート）
    async function exportAll() {
      const withSheet = adminList.filter(a => a.sheet);
      if (!adminMonthShown || withSheet.length === 0) {
        showMessage("出力できる勤務表がありません。先に「表示を更新」を押してください。", true, "adminMessage");
        return;
      }
      if (!excelReady("adminMessage")) return;

      const workbook = new ExcelJS.Workbook();
      const usedNames = new Set();
      for (const a of withSheet) {
        // シート名は氏名（31文字まで・同じ名前があれば番号を付ける）
        const base = (safeText(a.person.full_name) || "社員").slice(0, 28);
        let name = base, n = 2;
        while (usedNames.has(name)) name = base + "(" + n++ + ")";
        usedNames.add(name);
        fillSheet(workbook, name, a.sheet.rows, a.sheet.settings, a.person.full_name);
      }
      const fileName = makeFileName(adminMonthShown, "全員");
      await downloadWorkbook(workbook, fileName);
      showMessage("「" + fileName + "」を出力しました（" + withSheet.length + "人分）。", false, "adminMessage");
    }

    // 差し戻し（提出済 → 作成中）。社員がまた修正できるようになります
    async function reopenSheet(a) {
      const { year, month } = adminMonthShown;
      if (!confirm(a.person.full_name + " さんの " + year + "年" + month + "月の勤務表を差し戻します。よろしいですか？")) return;
      const { data, error } = await sb.from("timesheets")
        .update({ status: "draft" })
        .eq("user_id", a.person.id)
        .eq("year", year)
        .eq("month", month)
        .select("updated_at");
      if (error || !data || data.length === 0) {
        showMessage("差し戻しできませんでした" + (error ? "（" + error.message + "）" : "") + "。", true, "adminMessage");
        return;
      }
      await loadAdmin();
      showMessage(a.person.full_name + " さんの勤務表を差し戻しました。", false, "adminMessage");
    }

    // ------------------------------------------------------------
    // 画面の切り替え
    // ------------------------------------------------------------

    // "login"（ログイン）・"password"（パスワード設定）・"app"（勤務表）のどれかを表示する
    function showView(name) {
      $("loginView").classList.toggle("hidden", name !== "login");
      $("passwordView").classList.toggle("hidden", name !== "password");
      $("appView").classList.toggle("hidden", name !== "app");
    }

    // "my"（自分の勤務表）・"admin"（管理者）のタブを切り替える
    let adminLoaded = false;
    function switchTab(name) {
      $("myTab").classList.toggle("active", name === "my");
      $("adminTab").classList.toggle("active", name === "admin");
      $("myView").classList.toggle("hidden", name !== "my");
      $("adminView").classList.toggle("hidden", name !== "admin");
      if (name === "admin" && !adminLoaded) {
        adminLoaded = true;
        loadAdmin();
      }
    }

    // ------------------------------------------------------------
    // ログイン（Supabase Auth）
    // ------------------------------------------------------------

    // 招待メール・パスワード再設定メールのリンクから開いたかを、URLの「#」より後ろで調べる
    const hashParams = new URLSearchParams(location.hash.slice(1));
    let needPassword = ["invite", "recovery"].includes(hashParams.get("type"));

    // リンクの有効期限が切れていたときなどは、エラーの内容がURLに付いてくる
    const linkError = hashParams.get("error_description");

    // config.js が正しく設定されているかを調べる
    const configured = typeof SUPABASE_URL === "string" && SUPABASE_URL.startsWith("https://") &&
      typeof SUPABASE_ANON_KEY === "string" && !SUPABASE_ANON_KEY.includes("ここに");

    let sb = null;  // Supabase とやりとりするための道具

    if (!configured || typeof supabase === "undefined") {
      showView("login");
      $("loginButton").disabled = true;
      showMessage(configured
        ? "ログイン用の部品を読み込めませんでした。インターネット接続を確認して、ページを再読み込みしてください。"
        : "接続先が設定されていません。config.js に Supabase の URL とキーを書いてください（README.md を参照）。", true, "loginMessage");
    } else {
      sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // ログインの状態が変わるたびに呼ばれる（ページを開いたとき・ログイン・ログアウトなど）
      sb.auth.onAuthStateChange(function (event, session) {
        if (event === "PASSWORD_RECOVERY") needPassword = true;
        // この中で直接データベースを読むと止まることがあるため、少し後で処理する
        setTimeout(function () { handleSession(session); }, 0);
      });
    }

    async function handleSession(session) {
      if (!session) {
        currentUser = null;
        profile = null;
        showView("login");
        if (linkError) showMessage("リンクが無効か、有効期限が切れています。もう一度メールを送ってください。（" + linkError + "）", true, "loginMessage");
        return;
      }
      if (needPassword) {
        showView("password");
        return;
      }
      // すでに同じ人で開いていれば何もしない（ログインの更新のときなど）
      if (currentUser && currentUser.id === session.user.id) return;
      currentUser = session.user;
      await startApp();
    }

    // ログインできたら、社員の情報を読み込んで勤務表の画面を開く
    async function startApp() {
      const { data, error } = await sb.from("profiles").select("*").eq("id", currentUser.id).maybeSingle();
      if (error || !data) {
        showView("login");
        showMessage("社員の情報が見つかりませんでした。管理者に連絡してください。" + (error ? "（" + error.message + "）" : ""), true, "loginMessage");
        return;
      }
      profile = data;
      $("userEmail").textContent = currentUser.email;
      $("employeeName").value = profile.full_name;
      $("adminTab").classList.toggle("hidden", !profile.is_admin);
      adminLoaded = false;
      switchTab("my");
      showView("app");
      await loadMonth();
    }

    // 「ログイン」ボタン
    $("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();  // ページの再読み込みを止める
      $("loginButton").disabled = true;
      showMessage("ログイン中…", false, "loginMessage");
      const { error } = await sb.auth.signInWithPassword({
        email: $("loginEmail").value.trim(),
        password: $("loginPassword").value
      });
      $("loginButton").disabled = false;
      if (error) {
        showMessage("ログインできませんでした。メールアドレスとパスワードを確認してください。", true, "loginMessage");
        return;
      }
      $("loginPassword").value = "";
      showMessage("", false, "loginMessage");
    });

    // 「パスワードを忘れた場合」：再設定用のメールを送る
    $("forgotButton").addEventListener("click", async function () {
      const email = $("loginEmail").value.trim();
      if (!email) {
        showMessage("メールアドレスを入力してから押してください。", true, "loginMessage");
        return;
      }
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      if (error) {
        showMessage("メールを送れませんでした（" + error.message + "）。", true, "loginMessage");
        return;
      }
      showMessage(email + " にパスワード再設定のメールを送りました。メールのリンクを開いてください。", false, "loginMessage");
    });

    // 「設定する」ボタン（新しいパスワード）
    $("passwordForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const password = $("newPassword").value;
      if (password !== $("newPassword2").value) {
        showMessage("2つのパスワードが一致していません。", true, "passwordMessage");
        return;
      }
      $("passwordButton").disabled = true;
      const { error } = await sb.auth.updateUser({ password: password });
      $("passwordButton").disabled = false;
      if (error) {
        showMessage("パスワードを設定できませんでした（" + error.message + "）。", true, "passwordMessage");
        return;
      }
      needPassword = false;
      history.replaceState(null, "", location.pathname);  // URLに残ったリンクの情報を消す
      const { data } = await sb.auth.getSession();
      handleSession(data.session);
    });

    // 「ログアウト」ボタン
    $("logoutButton").addEventListener("click", async function () {
      if (!(await saveNow()) && !confirm("保存できていない変更があります。ログアウトすると消えてしまいます。ログアウトしますか？")) {
        return;
      }
      dirty = false;
      rows = [];
      shown = null;
      sheetStatus = null;
      adminList = [];
      setSaveStatus("");
      showMessage("");
      await sb.auth.signOut();
    });

    // ボタンが押されたときの動き
    $("createButton").addEventListener("click", createSchedule);
    $("saveButton").addEventListener("click", saveButtonClicked);
    $("submitButton").addEventListener("click", submitSheet);
    $("excelButton").addEventListener("click", exportMine);
    $("pdfButton").addEventListener("click", exportPdfMine);
    $("targetMonth").addEventListener("change", loadMonth);
    $("employeeName").addEventListener("change", saveName);
    $("myTab").addEventListener("click", () => switchTab("my"));
    $("adminTab").addEventListener("click", () => switchTab("admin"));
    $("adminReloadButton").addEventListener("click", loadAdmin);
    $("adminMonth").addEventListener("change", loadAdmin);
    $("adminExportAllButton").addEventListener("click", exportAll);
    // 絞り込み・並べ替えを変えたら、読み込み済みの一覧で表を作り直す（データベースは読み直さない）
    $("adminFilter").addEventListener("change", renderAdmin);
    $("adminSort").addEventListener("change", renderAdmin);
  </script>
